name: Deploy Docs

on:
  push:
    tags:
      - "v*"
      - "!v*-alpha*"
      - "!v*-beta*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/configure-pages@v6.0.0

      - run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Build examples
        run: |
          # Experimental examples and explainers live one level deeper but
          # publish to the same flat URL space: `basename` drops the
          # `experimental/` or `explainers/` segment, so an example keeps its
          # URL when it moves between these directories.
          for dir in examples/*/ examples/experimental/*/ examples/explainers/*/; do
            example=$(basename "$dir")
            # `examples/experimental/` and `examples/explainers/` themselves
            # match the first glob and have no package.json. Skip them before
            # `node -p` runs, since the step uses `bash -e` and a failed
            # command substitution would abort the build.
            if [ ! -f "$dir/package.json" ]; then
              echo "Skipping $example (not a package)"
              continue
            fi
            has_build=$(node -p "Boolean((require('./$dir/package.json').scripts||{}).build)")
            if [ "$has_build" != "true" ]; then
              echo "Skipping $example (no build script)"
              continue
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pnpm --filter "$pkg_name" build
            mkdir -p "docs/static/examples/$example"
            cp -r "$dir/dist/." "docs/static/examples/$example/"
          done

      - name: Inject Plausible and favicon into examples
        run: |
          find docs/static/examples -name "index.html" | while read f; do
            sed -i 's#</head>#<script async src="https://plausible.io/js/pa-GXbpwCRHPm1QSDOLNB_on.js"></script><script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script></head>#' "$f"
            sed -i 's#</head>#<link rel="icon" href="/deck.gl-raster/img/ds_favicon.png"></head>#' "$f"
          done

      - name: Build docs
        working-directory: docs
        run: pnpm build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
