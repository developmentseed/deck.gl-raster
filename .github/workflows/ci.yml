name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.63.2
          working-directory: ./fixtures/geotiff-test-data

      # NPY fixtures are generated from the GeoTIFF fixtures on demand with
      # rasterio
      - name: Create npy fixtures
        working-directory: ./fixtures/geotiff-test-data
        run: pixi run generate-npy

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: |
          pnpm install
          pnpm build
          pnpm -r --filter="!docs" typecheck
          pnpm test
          pnpm publint

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: biomejs/setup-biome@v2.7.1
      - run: biome ci .
