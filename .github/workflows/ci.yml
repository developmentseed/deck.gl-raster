name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.63.2
          working-directory: ./fixtures/geotiff-test-data

      # NPY fixtures are generated from the GeoTIFF fixtures on demand with
      # rasterio
      - name: Create npy fixtures
        working-directory: ./fixtures/geotiff-test-data
        run: pixi run generate-npy

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: |
          pnpm install
          pnpm build
          pnpm -r --filter="!docs" typecheck
          pnpm test
          pnpm publint

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
      - run: biome ci .
