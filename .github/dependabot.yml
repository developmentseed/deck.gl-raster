version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Separate group for visgl libraries, released jointly. Includes majors
      # so a new deck.gl major arrives as one PR rather than one per package.
      vis-gl:
        patterns:
          - "@deck.gl/*"
          - "@luma.gl/*"
          - "@math.gl/*"
          - "@loaders.gl/*"
      # Basemap libraries used by the examples' interleaved deck.gl overlay.
      # react-map-gl's types track the MapLibre major, so they move together.
      maplibre:
        patterns:
          - "maplibre-gl"
          - "react-map-gl"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
